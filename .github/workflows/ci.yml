name: Nexus RAG Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Linux System Libraries (OpenGL, GLib, Build Tools)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgl1 \
          libglib2.0-0 \
          libgomp1 \
          build-essential

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Validate Python Syntax & Bytecode Compilation
      env:
        GROQ_API_KEY: "ci_dummy_key_validation"
      run: |
        python -m py_compile app.py

    - name: Streamlit App Headless Import & Health Check
      env:
        GROQ_API_KEY: "ci_dummy_key_validation"
      run: |
        python -c "import app; print('✓ App module imported and initialized successfully.')"